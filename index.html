<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 全屏纹理背景 ===== */
        #dynamic-bg {
            position: fixed;
            inset: 0;
            z-index: -10;
            background-size: cover;
            background-position: center;
            transition: background-image 1.5s ease-in-out;
        }

        /* ===== 全屏聊天容器 ===== */
        #chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== 消息区域 ===== */
        #messages {
            flex: 1;
            padding: 24px 20px 160px;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        #messages::-webkit-scrollbar { width: 0; background: transparent; }

        .message {
            max-width: 80%;
            margin-bottom: 12px;
            padding: 14px 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            text-wrap: pretty;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* AI 消息 - 浅色玻璃气泡 */
        .message.bot {
            align-self: flex-start;
            color: #1a1c1d;
            border-radius: 2rem;

            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* 用户消息 - 半透明玻璃 */
        .message.user {
            margin-left: auto;
            color: #1a1c1d;
            border-radius: 2rem;

            background: rgba(27, 27, 27, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        /* ===== 底部输入栏 ===== */
        #input-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 768px;
            z-index: 30;
        }

        #input-wrapper {
            display: flex;
            align-items: flex-end;
            border-radius: 999px;
            padding: 6px;

            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                0 4px 16px rgba(0, 0, 0, 0.05),
                0 16px 40px rgba(0, 0, 0, 0.02);
        }

        /* 工具栏按钮 */
        .toolbar-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
            color: #4c4546;
            font-size: 22px;
        }
        .toolbar-btn:hover { background: rgba(255,255,255,0.5); }
        .toolbar-btn .material-symbols-outlined { font-size: 22px; }

        /* 输入框 */
        #user-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 10px 12px;
            font-size: 16px;
            font-family: var(--font-family);
            max-height: 120px;
            resize: none;
            outline: none;
            color: #1a1c1d;
        }

        #user-input::placeholder {
            color: rgba(76, 69, 70, 0.5);
        }

        /* 发送按钮 */
        .send-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1b1b1b;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 4px;
            flex-shrink: 0;
            transition: transform 0.15s, opacity 0.15s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .send-button:hover:not(:disabled) { transform: scale(1.05); }
        .send-button:active:not(:disabled) { transform: scale(0.95); }
        .send-button:disabled { opacity: 0.3; background: #ccc; cursor: not-allowed; box-shadow: none; }
        .send-button .material-symbols-outlined { font-size: 22px; }

        /* ===== 设置面板 - 悬浮玻璃弹窗 ===== */
        #settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        #settings-overlay.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #settings-container {
            width: 340px;
            border-radius: 24px;
            padding: 24px;
            animation: slideUp 0.25s ease-out;

            /* 液态玻璃 */
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                0 8px 32px rgba(0, 0, 0, 0.06),
                0 24px 64px rgba(0, 0, 0, 0.04);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #settings-container h3 {
            margin: 0 0 16px;
            font-size: 18px;
            font-weight: 600;
            color: #1a1c1d;
        }

        #settings-container label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: rgba(76, 69, 70, 0.6);
            margin-bottom: 6px;
            margin-top: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #settings-container label:first-of-type { margin-top: 0; }

        #settings-container input[type="text"],
        #settings-container input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 14px;
            background: rgba(255,255,255,0.5);
            font-size: 14px;
            outline: none;
            color: #1a1c1d;
            transition: border-color 0.2s, background 0.2s;
        }

        #settings-container input[type="text"]:focus,
        #settings-container input[type="password"]:focus {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(255,255,255,0.65);
        }

        /* 文件上传 */
        #bg-upload {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            color: rgba(76, 69, 70, 0.6);
            background: rgba(255,255,255,0.3);
            border: 1px dashed rgba(255,255,255,0.5);
            border-radius: 14px;
            cursor: pointer;
            margin-top: 4px;
        }
        #bg-upload:hover { border-color: rgba(255,255,255,0.8); }

        #settings-container button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #1b1b1b;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        #settings-container button:hover { transform: scale(1.02); }
        #settings-container button:active { transform: scale(0.98); }

        /* Markdown */
        .message p { margin: 0 0 0.5em; }
        .message p:last-child { margin: 0; }
        .message code {
            background: rgba(0,0,0,0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 0.88em;
            color: #5e5e5e;
        }
        .message pre {
            background: rgba(0,0,0,0.04);
            padding: 14px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid rgba(0,0,0,0.06);
        }
        .message pre code {
            background: none;
            padding: 0;
            color: #1a1c1d;
        }
        .message a { color: #6366f1; text-decoration: underline; }
        .message ul, .message ol { padding-left: 1.2em; }
        .message blockquote {
            border-left: 3px solid rgba(99,102,241,0.4);
            margin: 0.5em 0;
            padding-left: 0.8em;
            color: rgba(26,28,29,0.6);
        }

        /* Loading dots */
        .typing-indicator span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: rgba(26,28,29,0.3);
            border-radius: 50%;
            animation: typing 1.2s infinite ease-in-out;
            margin: 0 2.5px;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-5px); opacity: 0.7; }
        }

        /* 切换壁纸按钮 */
        .bg-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.5);
            color: #4c4546;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
        }
        .bg-toggle:hover { background: rgba(255,255,255,0.5); color: #1a1c1d; }
        .bg-toggle .material-symbols-outlined { font-size: 20px; }
    </style>
</head>
<body>

    <div id="dynamic-bg"></div>

    <div id="chat-container">
        <div id="messages">
            <div class="message bot">Hello! I am your AI assistant. How can I help you today?</div>
        </div>

        <div id="input-container">
            <div id="input-wrapper">
                <button class="toolbar-btn" id="show-settings" title="Settings">
                    <span class="material-symbols-outlined">settings</span>
                </button>

                <textarea id="user-input" rows="1" placeholder="Message Aura..."></textarea>

                <button class="send-button" id="send-button" disabled>
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_upward</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-overlay">
        <div id="settings-container">
            <h3>Settings</h3>
            <label for="api-key">API KEY</label>
            <input type="password" id="api-key" placeholder="sk-..." value="sk-jkr...swdq">

            <label for="api-url">API URL</label>
            <input type="text" id="api-url" placeholder="https://..." value="https://api.deepseek.com/chat/completions">

            <label for="bg-upload">Custom Background</label>
            <input type="file" id="bg-upload" accept="image/*">

            <button id="save-api">Save & Close</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ===== 纹理纯色背景 =====
            const texturedBgs = [
                // 暖色渐变纹理
                "radial-gradient(ellipse at 20% 50%, #ffecd2 0%, #fcb69f 100%)",
                "radial-gradient(ellipse at 80% 20%, #a1c4fd 0%, #c2e9fb 100%)",
                "radial-gradient(ellipse at 60% 80%, #d4fc79 0%, #96e6a1 100%)",
                "radial-gradient(ellipse at 30% 30%, #fbc2eb 0%, #a6c1ee 100%)",
                "radial-gradient(ellipse at 70% 60%, #fddb92 0%, #d1fdff 100%)",
                "radial-gradient(ellipse at 50% 10%, #e0c3fc 0%, #8ec5fc 100%)",
                "radial-gradient(ellipse at 10% 90%, #f093fb 0%, #f5576c 100%)",
                "radial-gradient(ellipse at 80% 70%, #4facfe 0%, #00f2fe 100%)",
                "radial-gradient(ellipse at 40% 40%, #43e97b 0%, #38f9d7 100%)",
                "radial-gradient(ellipse at 90% 10%, #fa709a 0%, #fee140 100%)",
                "radial-gradient(ellipse at 20% 80%, #667eea 0%, #764ba2 100%)",
                "radial-gradient(ellipse at 50% 50%, #ff9a9e 0%, #fecfef 100%)",
                "radial-gradient(ellipse at 60% 20%, #a6c0fe 0%, #f68084 100%)",
                "radial-gradient(ellipse at 30% 70%, #fccb90 0%, #d57eeb 100%)",
                "radial-gradient(ellipse at 75% 30%, #96fbc4 0%, #f9f586 100%)",
                "radial-gradient(ellipse at 45% 60%, #667eea 0%, #764ba2 100%)",
                "radial-gradient(ellipse at 25% 25%, #f6d5f7 0%, #fda085 100%)",
                // 带噪点纹理的纯色
                "repeating-conic-gradient(from 0deg at 50% 50%, #e8d5b7 0deg, #f5e6c8 3deg, #e8d5b7 6deg) 0 0 / 30px 30px, linear-gradient(135deg, #f5e6c8, #d4c4a8)",
                "repeating-conic-gradient(from 0deg at 50% 50%, #c8d8e8 0deg, #dce8f5 3deg, #c8d8e8 6deg) 0 0 / 24px 24px, linear-gradient(135deg, #dce8f5, #a8c0a0)",
                "repeating-conic-gradient(from 0deg at 50% 50%, #d4b8e8 0deg, #e8c8f5 3deg, #d4b8e8 6deg) 0 0 / 28px 28px, linear-gradient(135deg, #e8c8f5, #c4a8d4)",
                "repeating-conic-gradient(from 0deg at 50% 50%, #b8e8d4 0deg, #c8f5e0 3deg, #b8e8d4 6deg) 0 0 / 32px 32px, linear-gradient(135deg, #c8f5e0, #a0d4c0)",
                "repeating-conic-gradient(from 0deg at 50% 50%, #f5d8c8 0deg, #f5e0d8 3deg, #f5d8c8 6deg) 0 0 / 26px 26px, linear-gradient(135deg, #f5e0d8, #e8b8a0)",
                "repeating-conic-gradient(from 0deg at 50% 50%, #e8e0d4 0deg, #f5e8d8 3deg, #e8e0d4 6deg) 0 0 / 20px 20px, linear-gradient(135deg, #f5e8d8, #d8c8a0)",
                "repeating-conic-gradient(from 0deg at 50% 50%, #d8e8e8 0deg, #e0f0f5 3deg, #d8e8e8 6deg) 0 0 / 36px 36px, linear-gradient(135deg, #e0f0f5, #a0c8c8)",
            ];

            let bgIndex = 0;
            const bgEl = document.getElementById('dynamic-bg');

            // 优先加载自定义背景
            let customBg = localStorage.getItem('custom_bg');
            if (!customBg) customBg = sessionStorage.getItem('custom_bg');
            if (customBg) {
                bgEl.style.backgroundImage = `url(${customBg})`;
            } else {
                // 随机纹理背景
                const randomBg = texturedBgs[Math.floor(Math.random() * texturedBgs.length)];
                bgEl.style.background = randomBg;
            }

            // 双击背景切换纹理
            bgEl.addEventListener('dblclick', () => {
                bgEl.style.background = texturedBgs[bgIndex % texturedBgs.length];
                bgIndex++;
            });

            // ===== 聊天逻辑 =====
            const messagesContainer = document.getElementById('messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const apiKeyInput = document.getElementById('api-key');
            const apiUrlInput = document.getElementById('api-url');
            const showSettingsButton = document.getElementById('show-settings');
            const settingsOverlay = document.getElementById('settings-overlay');
            const settingsContainer = document.getElementById('settings-container');
            const saveApiButton = document.getElementById('save-api');
            const modelSelect = document.getElementById('model-select');
            const bgUpload = document.getElementById('bg-upload');

            // 自动调整输入框高度
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                checkInput();
            });

            function setCookie(name, value, days) {
                let expires = "";
                if (days) {
                    const date = new Date();
                    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                    expires = "; expires=" + date.toUTCString();
                }
                document.cookie = name + "=" + (value || "") + expires + "; path=/";
            }

            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            }

            let apiKey = getCookie('API_KEY') || localStorage.getItem('apiKey') || apiKeyInput.value;
            let apiUrl = getCookie('API_URL') || localStorage.getItem('apiUrl') || apiUrlInput.value;
            let selectedModel = getCookie('SELECTED_MODEL') || localStorage.getItem('selectedModel');

            if (apiKey) apiKeyInput.value = apiKey;
            if (apiUrl) apiUrlInput.value = apiUrl;

            let context = [];
            const MAX_CONTEXT_SIZE = 6;

            // 设置弹窗
            showSettingsButton.addEventListener('click', (e) => {
                e.stopPropagation();
                settingsOverlay.classList.add('active');
            });

            settingsOverlay.addEventListener('click', (e) => {
                if (e.target === settingsOverlay) {
                    settingsOverlay.classList.remove('active');
                }
            });

            saveApiButton.addEventListener('click', () => {
                apiKey = apiKeyInput.value.trim();
                apiUrl = apiUrlInput.value.trim();
                setCookie('API_KEY', apiKey, 365);
                setCookie('API_URL', apiUrl, 365);
                localStorage.setItem('apiKey', apiKey);
                localStorage.setItem('apiUrl', apiUrl);
                settingsOverlay.classList.remove('active');
            });

            // 自定义背景上传
            bgUpload.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    // 先设置背景（保留 background-size/position）
                    bgEl.style.backgroundImage = `url(${dataUrl})`;
                    // 尝试存 localStorage，失败则用 sessionStorage
                    try {
                        localStorage.setItem('custom_bg', dataUrl);
                    } catch (err) {
                        console.warn('localStorage quota exceeded, falling back to sessionStorage', err);
                        sessionStorage.setItem('custom_bg', dataUrl);
                    }
                };
                reader.onerror = function() {
                    console.error('FileReader error while reading background image');
                };
                reader.readAsDataURL(file);
            });

            function checkInput() {
                sendButton.disabled = userInput.value.trim() === "";
            }

            function appendMessage(content, sender, isHtml = false) {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${sender}`;

                if (isHtml) {
                    messageElement.innerHTML = content;
                } else {
                    if (sender === 'bot' && typeof marked !== 'undefined') {
                        messageElement.innerHTML = marked.parse(content);
                    } else {
                        messageElement.textContent = content;
                    }
                }

                messagesContainer.appendChild(messageElement);
                requestAnimationFrame(() => {
                    messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' });
                });
                return messageElement;
            }

            async function sendMessage() {
                const userMessage = userInput.value.trim();
                if (!userMessage) return;

                if (!apiKey) {
                    alert("Please set your API Key in settings.");
                    settingsOverlay.classList.add('active');
                    return;
                }

                userInput.value = '';
                userInput.style.height = 'auto';
                sendButton.disabled = true;

                appendMessage(userMessage, 'user');
                context.push({ role: 'user', content: userMessage });

                const loadingId = 'loading-' + Date.now();
                const loadingElement = appendMessage('<div class="typing-indicator"><span></span><span></span><span></span></div>', 'bot', true);
                loadingElement.id = loadingId;

                const currentModel = selectedModel || 'deepseek-v4-flash';

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: currentModel,
                            messages: context.slice(-MAX_CONTEXT_SIZE),
                            stream: true,
                            temperature: 0.7
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    loadingElement.remove();

                    let botMessageContent = "";
                    const botMessageElement = appendMessage("", 'bot');

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const data = JSON.parse(line.substring(6));
                                    if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {
                                        botMessageContent += data.choices[0].delta.content;
                                        botMessageElement.innerHTML = marked.parse(botMessageContent);
                                        const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 100;
                                        if (isAtBottom) {
                                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                                        }
                                    }
                                } catch (e) {
                                    console.error("Parse error", e);
                                }
                            }
                        }
                    }

                    context.push({ role: 'assistant', content: botMessageContent });

                } catch (error) {
                    document.getElementById(loadingId)?.remove();
                    appendMessage(`Error: ${error.message}`, 'bot');
                } finally {
                    sendButton.disabled = false;
                    checkInput();
                }
            }

            sendButton.addEventListener('click', sendMessage);

            userInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });

            checkInput();
        });
    </script>
</body>
</html>
